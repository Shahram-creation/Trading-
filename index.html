<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Generator</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#1a1d21;--muted:#6b7280;--up:#16a34a;--down:#dc2626;--none:#9ca3af;--bd:#e5e7eb;--btn:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--text:#e8eaed;--muted:#9aa0a6;--bd:#2a2e36}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;padding:16px;max-width:720px;margin-inline:auto}
h1{font-size:20px;margin:0 0 12px}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
input,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--text);font-size:15px;margin-bottom:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{width:100%;padding:14px;border:0;border-radius:10px;background:var(--btn);color:#fff;font-size:16px;font-weight:600}
button:disabled{opacity:.6}
.sub{color:var(--muted);font-size:13px;margin:10px 0 14px}
.res{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;text-align:center}
.res .name{font-weight:600;font-size:16px}
.big{font-size:34px;font-weight:800;margin:10px 0 2px}
.UP{color:var(--up)}.DOWN{color:var(--down)}.NONE,.ERROR{color:var(--none)}
.pct{font-size:20px;font-weight:600}
.meta{color:var(--muted);font-size:12px;margin-top:10px;line-height:1.5}
.ai{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-top:12px;font-size:14px;line-height:1.5}
.ai b{display:block;margin-top:8px}
.warn{margin-top:16px;font-size:12px;color:var(--muted);line-height:1.5}
</style>
</head>
<body>
<h1>📊 Signal Generator</h1>
<label>Twelve Data API key (ek baar daalo)</label>
<input id="key" type="password" placeholder="API key">
<div class="row">
  <div><label>Gemini API key (AI ke liye)</label><input id="gkey" type="password" placeholder="Gemini key"></div>
  <div><label>Gemini model</label><input id="gmodel" type="text" placeholder="gemini-3.5-flash"></div>
</div>
<div class="row">
  <div><label>Asset</label>
    <select id="asset">
      <option value="XAU/USD">Gold (XAU/USD)</option>
      <option value="XAG/USD">Silver (XAG/USD)</option>
      <option value="AUD/USD">AUD/USD</option>
      <option value="EUR/USD">EUR/USD</option>
      <option value="GBP/USD">GBP/USD</option>
      <option value="USD/JPY">USD/JPY</option>
      <option value="USD/CAD">USD/CAD</option>
      <option value="USD/CHF">USD/CHF</option>
      <option value="NZD/USD">NZD/USD</option>
      <option value="EUR/JPY">EUR/JPY</option>
      <option value="GBP/JPY">GBP/JPY</option>
      <option value="AUD/JPY">AUD/JPY</option>
      <option value="EUR/GBP">EUR/GBP</option>
      <option value="BTC/USD">Bitcoin (BTC/USD)</option>
      <option value="ETH/USD">Ethereum (ETH/USD)</option>
    </select></div>
  <div><label>Time (trade expiry)</label>
    <select id="tf">
      <option value="1">1 min</option>
      <option value="2">2 min</option>
      <option value="3">3 min</option>
      <option value="5" selected>5 min</option>
      <option value="15">15 min</option>
      <option value="30">30 min</option>
    </select></div>
</div>
<button id="go">Generate Signal</button>
<button id="ai" style="margin-top:10px;background:#7c3aed">AI Analysis (Gemini)</button>
<div class="sub" id="status">Asset aur time chuno, phir button dabao.</div>
<div id="out"></div>
<div id="aiout"></div>
<div class="warn">⚠️ Win % pichle data ka backtest hai (chuna hua time = 1 candle expiry). Chhote time (1-2 min) par win % aksar 50% ke aaspaas hota hai, matlab edge kam hota hai. Guarantee nahi, pehle demo account par test karo.</div>
<script>
var keyEl = document.getElementById('key');
try { keyEl.value = localStorage.getItem('td_key') || ''; } catch(e) {}
var NATIVE = {1:'1min',2:'1min',3:'1min',5:'5min',15:'15min',30:'30min'};

function ema(a, n){ var k=2/(n+1), o=[a[0]]; for(var i=1;i<a.length;i++) o.push(a[i]*k+o[i-1]*(1-k)); return o; }
function rsi(a, n){
  var o=new Array(a.length).fill(null), g=0, l=0;
  for(var i=1;i<a.length;i++){
    var d=a[i]-a[i-1], gi=Math.max(d,0), li=Math.max(-d,0);
    if(i<=n){ g+=gi/n; l+=li/n; if(i===n) o[i]=100-100/(1+g/(l||1e-9)); }
    else { g=(g*(n-1)+gi)/n; l=(l*(n-1)+li)/n; o[i]=100-100/(1+g/(l||1e-9)); }
  }
  return o;
}
function aggregate(rows, m){
  var c=[], t=[], lastKey=null;
  rows.forEach(function(r){
    var ms = Date.parse(r.datetime.replace(' ','T')+'Z'), key = Math.floor(ms/(m*60000));
    if(key===lastKey){ c[c.length-1]=parseFloat(r.close); t[t.length-1]=r.datetime; }
    else { c.push(parseFloat(r.close)); t.push(r.datetime); lastKey=key; }
  });
  return {c:c, t:t};
}
function analyze(c, t){
  var e9=ema(c,9), e21=ema(c,21), r=rsi(c,14);
  var sig = c.map(function(_,i){
    if(r[i]===null || i<21) return 0;
    if(e9[i]>e21[i] && r[i]>=50 && r[i]<=70) return 1;
    if(e9[i]<e21[i] && r[i]>=30 && r[i]<50) return -1;
    return 0;
  });
  var last=c.length-1, out={price:c[last], rsi:r[last], time:t[last], signal:'NONE', win:null, n:0, size:c.length,
    e9:e9[last], e21:e21[last], tail:c.slice(-40)};
  if(sig[last]!==0){
    var dir=sig[last], w=0, n=0;
    for(var i=0;i<last;i++){
      if(sig[i]===dir){ n++; if(dir===1 ? c[i+1]>c[i] : c[i+1]<c[i]) w++; }
    }
    out.signal = dir===1 ? 'UP' : 'DOWN';
    out.n=n; out.win = n>=30 ? (100*w/n).toFixed(1) : null;
  }
  return out;
}
function show(name, tf, x){
  var txt = x.signal==='UP' ? '▲ UP' : x.signal==='DOWN' ? '▼ DOWN' : x.signal==='ERROR' ? 'ERROR' : 'NO SIGNAL';
  var pct = (x.signal==='UP'||x.signal==='DOWN') ? '<div class="pct">'+(x.win ? 'Win '+x.win+'% ('+x.n+' trades)' : 'Win %: kam data')+'</div>' : '';
  var meta = x.price!==undefined ? 'Price '+x.price+' · RSI '+x.rsi.toFixed(0)+'<br>Last candle: '+x.time+' · '+x.size+' candles ka backtest' : (x.note||'');
  document.getElementById('out').innerHTML = '<div class="res"><div class="name">'+name+' · '+tf+' min</div><div class="big '+x.signal+'">'+txt+'</div>'+pct+'<div class="meta">'+meta+'</div></div>';
}
var cache={}, IV={'1min':1,'5min':5,'15min':15,'30min':30};
async function td(sym, interval, size, key){
  var url='https://api.twelvedata.com/time_series?symbol='+encodeURIComponent(sym)+'&interval='+interval+'&outputsize='+size+'&apikey='+key;
  var d=await (await fetch(url)).json();
  if(d.status==='error') throw new Error(d.message);
  return d.values.slice().reverse();
}
async function getRows(sym, tf, key){
  var iv=NATIVE[tf], ck=sym+'|'+iv, c=cache[ck];
  var stale = c && ((Date.now()-Date.parse(c[c.length-1].datetime.replace(' ','T')+'Z'))/60000/IV[iv] > 8);
  if(!c || stale){ c=cache[ck]=await td(sym, iv, 1000, key); return c; }
  var nw=await td(sym, iv, 10, key);
  nw.forEach(function(r){
    var i=c.length-1; while(i>=0 && c[i].datetime>r.datetime) i--;
    if(i>=0 && c[i].datetime===r.datetime) c[i]=r; else c.splice(i+1,0,r);
  });
  return c;
}
var st=document.getElementById('status');
async function prefetch(){
  var key=keyEl.value.trim(); if(!key) return;
  var sym=document.getElementById('asset').value, tf=parseInt(document.getElementById('tf').value,10);
  st.textContent='Data ready kar raha hoon...';
  try{ await getRows(sym, tf, key); st.textContent='Ready ✓ Ab Generate dabao.'; }
  catch(e){ st.textContent='Error: '+e.message; }
}
['asset','tf'].forEach(function(id){ document.getElementById(id).onchange=prefetch; });
keyEl.onchange=prefetch;
if(keyEl.value) prefetch();
document.getElementById('go').onclick = async function(){
  var key=keyEl.value.trim(), sym=document.getElementById('asset').value, tf=parseInt(document.getElementById('tf').value,10);
  var btn=this, t0=performance.now();
  if(!key){ st.textContent='Pehle API key daalo.'; return; }
  try { localStorage.setItem('td_key', key); } catch(e) {}
  btn.disabled=true; st.textContent='Signal bana raha hoon...';
  try{
    var rows=(await getRows(sym, tf, key)).slice(); rows.pop(); // aakhri candle abhi ban rahi hai
    var m = tf<=3 ? tf : 1, agg=aggregate(rows, m);
    if(m>1){ agg.c.pop(); agg.t.pop(); }
    var res=analyze(agg.c, agg.t); window.lastCtx={sym:sym, tf:tf, res:res}; document.getElementById('aiout').innerHTML=''; show(sym, tf, res);
    st.textContent='Generated: '+new Date().toLocaleTimeString()+' ('+((performance.now()-t0)/1000).toFixed(1)+'s)';
  }catch(e){
    show(sym, tf, {signal:'ERROR', note:e.message});
    st.textContent='Error aaya.';
  }
  btn.disabled=false;
};

function esc(t){ return String(t==null?'':t).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
var gkeyEl=document.getElementById('gkey'), gmEl=document.getElementById('gmodel');
try{ gkeyEl.value=localStorage.getItem('g_key')||''; gmEl.value=localStorage.getItem('g_model')||'gemini-3.5-flash'; }catch(e){ gmEl.value='gemini-3.5-flash'; }
document.getElementById('ai').onclick = async function(){
  var out=document.getElementById('aiout'), gk=gkeyEl.value.trim(), gm=gmEl.value.trim()||'gemini-3.5-flash', btn=this;
  if(!window.lastCtx){ out.innerHTML='<div class="ai">Pehle Generate Signal dabao.</div>'; return; }
  if(!gk){ out.innerHTML='<div class="ai">Gemini API key daalo (aistudio.google.com se free).</div>'; return; }
  try{ localStorage.setItem('g_key',gk); localStorage.setItem('g_model',gm); }catch(e){}
  btn.disabled=true; out.innerHTML='<div class="ai">Gemini soch raha hai...</div>';
  var x=window.lastCtx.res, c=window.lastCtx;
  var prompt='You are a cautious trading analyst. Asset: '+c.sym+'. Candle/expiry: '+c.tf+' minute. '
   +'Last 40 closing prices (oldest to newest): '+x.tail.map(function(v){return +v.toFixed(5);}).join(', ')+'. '
   +'EMA9='+x.e9.toFixed(5)+', EMA21='+x.e21.toFixed(5)+', RSI14='+x.rsi.toFixed(1)+'. '
   +'Rule-based signal: '+x.signal+'. Backtest win rate of this rule: '+(x.win?x.win+'% over '+x.n+' trades':'not enough data')+'. '
   +'Decide whether the next candle closes UP or DOWN, or say NO TRADE if the setup is weak, choppy or uncertain. Do not invent data. '
   +'Reply ONLY as JSON: {"decision":"UP|DOWN|NO TRADE","confidence":0-100,"reason":"max 2 short sentences in Hinglish","risk":"one short risk note in Hinglish"}';
  try{
    var res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(gm)+':generateContent',{
      method:'POST', headers:{'Content-Type':'application/json','x-goog-api-key':gk},
      body:JSON.stringify({contents:[{parts:[{text:prompt}]}], generationConfig:{responseMimeType:'application/json', temperature:0.2}})
    });
    var d=await res.json();
    if(d.error) throw new Error(d.error.message);
    var txt=d.candidates[0].content.parts.map(function(p){return p.text||'';}).join('');
    var j=JSON.parse(txt.replace(/```json|```/g,'').trim());
    var agree = (j.decision===x.signal) ? '✅ Rule signal se match' : (x.signal==='NONE' ? 'ℹ️ Rule mein signal nahi tha' : '⚠️ Rule signal se alag');
    out.innerHTML='<div class="ai"><b style="margin:0">🤖 Gemini: '+esc(j.decision)+' · confidence '+esc(j.confidence)+'%</b>'
      +'<b>Reason</b>'+esc(j.reason)+'<b>Risk</b>'+esc(j.risk)+'<div class="meta">'+agree+'. Confidence sirf andaaza hai, asli win % backtest wala hai.</div></div>';
  }catch(e){
    out.innerHTML='<div class="ai">Gemini error: '+esc(e.message)+'<div class="meta">Model naam badal ke dekho (jaise gemini-3.5-flash-lite) ya key check karo.</div></div>';
  }
  btn.disabled=false;
};
</script>
</body>
</html>
